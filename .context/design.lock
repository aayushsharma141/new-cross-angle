# .context/design.lock
# IMMUTABLE DESIGN SYSTEM — read before writing any UI component
# Version: 1.1 | Approved by: Aayush | 2026-03-13

## AESTHETIC: UHNW Luxury Interior Design. Pure Black + Gold.

## COLOR RULES
Background      : bg-black                NEVER: bg-white, bg-zinc-900
Card surface    : bg-zinc-900/50          NEVER: bg-white rounded
Primary accent  : text-yellow-500         NEVER: text-blue-500
Body text       : text-zinc-300           NEVER: text-black
Secondary text  : text-zinc-500
Borders         : border-zinc-800
Muted surface   : bg-zinc-900

## TYPOGRAPHY
Headings (h1-h3): font-serif (Cormorant Garamond)
Body/Labels     : font-sans (DM Sans)
KPI numbers     : text-3xl font-bold text-yellow-500
Labels          : text-xs text-zinc-500 uppercase tracking-widest

## COMPONENTS
Dialogs         : bg-background/80 backdrop-blur-md border border-border
Header/Nav      : bg-background/80 backdrop-blur-md border-b border-border sticky
Primary buttons : bg-yellow-500 hover:bg-yellow-400 text-black font-semibold
Cards           : bg-card border border-border rounded-lg shadow-md
Table headers   : bg-muted text-muted-foreground text-xs uppercase
Table rows      : hover:bg-muted/50 border-b border-border
Skeletons       : bg-muted animate-pulse                NEVER: bg-gray-200
Sidebar active  : bg-yellow-500/10 text-yellow-400 border-r-2 border-yellow-500
Sidebar inactive: text-muted-foreground hover:text-foreground hover:bg-muted/50

## STATUS BADGES
new       : bg-blue-500/10 text-blue-400 border border-blue-500/20
contacted : bg-yellow-500/10 text-yellow-400 border border-yellow-500/20
won       : bg-green-500/10 text-green-400 border border-green-500/20
lost      : bg-red-500/10 text-red-400 border border-red-500/20
draft     : bg-muted text-muted-foreground
published : bg-green-500/10 text-green-400

## ANIMATIONS
Page entry   : animate-in fade-in zoom-in duration-500
Dialog open  : animate-in fade-in zoom-in-95 slide-in-from-bottom-2
Table row    : animate-in fade-in slide-in-from-left-1
Hover        : transition-all duration-200

## INTEGRITY CHECK (grep these before committing)
grep for bg-white    → must be 0 results in admin components
grep for bg-gray-50  → must be 0 results in admin components
grep for text-blue-500 / bg-blue-600 → 0 results (wrong accent)
grep for bg-gray-200 → 0 results (wrong skeleton)

