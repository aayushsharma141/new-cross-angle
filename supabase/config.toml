[functions.assign-first-admin]
verify_jwt = false

[functions.handle-new-lead]
verify_jwt = false

[functions.health]
verify_jwt = false

[functions.aesthetic-ai]
verify_jwt = false

# The three ImageKit functions are admin-only and mutate storage + the DB.
# They each call verifyAdmin() internally, but a stale deploy of
# migrate-to-imagekit shipped without that guard and was callable by anyone.
# verify_jwt is the platform-level second layer: it rejects requests carrying
# no JWT at all, so a missing in-function guard can no longer expose them.
# Safe for every real caller — browser calls go through /api/supabase, where
# middleware.ts (prod) and the vite proxy (dev) inject the user's access_token.
[functions.imagekit-upload]
verify_jwt = true

[functions.migrate-to-imagekit]
verify_jwt = true

[functions.sync-imagekit]
verify_jwt = true


[functions.admin-login]
enabled = true
verify_jwt = false
import_map = "./functions/admin-login/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-login/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-login/*.html" ]
