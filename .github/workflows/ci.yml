name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=web

      - name: Type Check
        run: npm run typecheck --workspace=web

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high severity)
        run: npm audit --audit-level=high --workspace=apps/web
        continue-on-error: true  # Report but don't block until all remaining highs are resolved

      - name: No console.log in production source
        run: node apps/web/scripts/checks/no-console-log.js

      - name: Architectural layer enforcement (dependency-cruiser)
        run: npm run arch:check --workspace=apps/web
        continue-on-error: true  # Enforce once baseline violations are resolved

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only build on main and PRs to main — saves CI minutes on feature branches
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}"
      VITE_SUPABASE_ANON_KEY: "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
      VITE_POSTHOG_KEY: "${{ secrets.VITE_POSTHOG_KEY }}"
      VITE_SENTRY_DSN: "${{ secrets.VITE_SENTRY_DSN }}"
      VITE_IMAGEKIT_URL_ENDPOINT: "${{ secrets.VITE_IMAGEKIT_URL_ENDPOINT }}"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web
